name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

env:
  NODE_VERSION: 24
  PNPM_VERSION: 12.9.1
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wedding_test?schema=public
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wedding_test?schema=public
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  AUTH_SECRET: uqxfaUFAiALabLo2W9v79eSM4qiuE+JQmbkWTNvB7fU=
  GUEST_COOKIE_SECRET: 4v0j2v+/gJ1qO0itSFYAoNS2s1wQPEoJo5lgz6BywIk=
  ADMIN_ALLOWLIST: hahyordeji@gmail.com,admin@example.com
  NOTIFY_EMAIL: hahyordeji@gmail.com
  BREVO_API_KEY: xkeysib-test-key
  EMAIL_FROM: admin@example.com
  CLOUDINARY_CLOUD_NAME: test_cloud
  CLOUDINARY_API_KEY: test_api_key
  CLOUDINARY_API_SECRET: test_api_secret
  CLOUDINARY_UPLOAD_PRESET: test_upload_preset
  PAYSTACK_SECRET_KEY: sk_test_dummy_key_for_ci

jobs:
  static:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wedding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy migrations
        run: pnpm prisma migrate deploy

      - name: Run integration tests
        run: pnpm test:integration

  build-e2e:
    name: Build & Artifacts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wedding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy migrations
        run: pnpm prisma migrate deploy

      - name: Seed database
        run: pnpm seed

      - name: Build Next.js application
        run: pnpm build

      - name: Upload .next build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            public
          retention-days: 1

  e2e:
    name: End-to-End Tests
    needs: build-e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wedding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy migrations
        run: pnpm prisma migrate deploy

      - name: Seed database
        run: pnpm seed

      - name: Download .next build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Install Playwright browsers and dependencies
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    needs: build-e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wedding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy migrations
        run: pnpm prisma migrate deploy

      - name: Seed database
        run: pnpm seed

      - name: Download .next build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
